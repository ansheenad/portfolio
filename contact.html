<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Ansheena D</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" href="images/favicon.webp" type="image/webp">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1 class="logo">
            <span class="firstPart">A</span>NSHEENA<span class="lastPart">.D</span>
        </h1>
        <nav class="nav">
            <a href="index.html" class="link">Back to Portfolio</a>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <section id="contact" class="contact-section">
        <h2 class="header">Contact Me</h2>
        <form id="contact-form" class="contact-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required placeholder="Type your message here"></textarea>
            </div>
            <button type="submit" class="submit-button">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Ansheena D. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://github.com/ansheenad" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/ansheena-d-0536081b2" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:ansheenad@gmail.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
